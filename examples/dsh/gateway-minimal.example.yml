# EXPERIMENTAL example only. Do not overwrite your full DSH profile with this fragment.
# Adapt to the DSH version actually installed, and merge under the existing llm-pi-ai row.
# Never put a real API key or private endpoint here in a public repository.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      gateway:
        displayName: FreeLLMAPI
        apiKeyEnv: GATEWAY_API_KEY
        api: openai-completions
        baseURL: https://your-freellmapi-host.example/v1
        retryPolicy:
          mode: normal
          maxRetries: 0
          retryableCodes:
            - SERVER
            - TIMEOUT
            - TRANSPORT
            - EMPTY_RESPONSE
        defaultMaxTokens: 8192
        models:
          - id: radeon:DeepSeek-V4-Flash
            name: Radeon DeepSeek V4 Flash (experimental)
            contextWindow: 131072 # conservative illustrative client-side value, not a verified hard cap
            maxTokens: 8192 # illustrative; verify exact upstream limit before use
            input:
              - text
          - id: groq:qwen/qwen3.8-27b
            name: Groq Qwen (limited experiment)
            contextWindow: 6000 # advisory context, NOT a guaranteed ITPM limit
            maxTokens: 1024
            input:
              - text
