name: Перевод или проверка носителем языка (русский)
description: Предложить перевод, проверить готовый текст или помочь с новым языком
body:
  - type: input
    id: locale
    attributes:
      label: Язык и код локали
      placeholder: 'zh-CN, fr-FR, es-ES, ...'
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: Путь к исходному документу
    validations:
      required: true
  - type: dropdown
    id: review
    attributes:
      label: Статус проверки перевода
      options:
        - Машинный черновик, нужна проверка носителя языка
        - Проверено человеком, свободно владеющим языком
        - Готов проверить перевод как носитель языка
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Комментарии к переводу или техническим терминам
