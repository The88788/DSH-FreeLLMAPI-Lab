name: Результаты эксперимента (русский)
description: Опубликовать проверяемые обезличенные результаты без сырых журналов DSH
body:
  - type: markdown
    attributes:
      value: "Не загружайте API-ключи, сырые сессии, личные промпты, закрытый код, абсолютные приватные пути, идентификаторы пользователей и рабочие базы данных."
  - type: input
    id: environment
    attributes:
      label: Версии программ и ОС
      description: "Укажите DSH, Camel, FreeLLMAPI и ОС. Если версия не установлена, напишите unknown."
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Точный идентификатор провайдера и модели
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Шаги воспроизведения и критерии выполнения задания
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Обезличенные результаты и ограничения проверки
    validations:
      required: true
